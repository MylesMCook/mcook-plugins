name: Validate Wails feedback kit
on:
  push:
    paths: ['wails/**', '.github/workflows/validate-wails-feedback.yml']
  pull_request:
    paths: ['wails/**', '.github/workflows/validate-wails-feedback.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'
      - name: Restore fixture parser outside the repository
        run: npm install --prefix "$RUNNER_TEMP/wails-feedback-parser" --no-audit --no-fund --ignore-scripts --no-package-lock typescript@6.0.3 agentation-mcp@1.3.2
      - name: Setup, rollback, wiring and supervisor checks (no providers)
        env:
          WAILS_FEEDBACK_TEST_APP: ${{ runner.temp }}/wails-feedback-parser
        run: node --test wails/skills/wails/assets/native-feedback/tests/*.test.mjs
      - name: Loopback proxy boundaries (stdlib only)
        env:
          GO111MODULE: 'off'
        run: go test ./wails/skills/wails/assets/native-feedback/backend/transport
      - name: Portable package and OpenAI compatibility
        run: uv run --with pyyaml==6.0.3 --with jsonschema==4.26.0 python mcook-plugin-builder/skills/build-mcook-plugin/scripts/validate_agent_plugin.py wails --marketplace .agents/plugins/marketplace.json --marketplace-root . --require-openai-overlay
      - name: Check whitespace
        run: git diff --check
