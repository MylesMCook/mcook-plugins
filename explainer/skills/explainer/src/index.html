<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="generator" content="{{GENERATOR}}">
<meta name="theme-color" content="#191615">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23191615'/%3E%3C/svg%3E">
<style>{{CSS}}</style>
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
</head>
<body class="intro">
<div class="app">
<header>
  <div class="brand"><h1 id="site-title"></h1><button type="button" id="btn-intro"></button><span class="by" id="byline" hidden><span>by</span><svg class="mark" viewBox="0 0 16 16" role="img" aria-label="Explainer mark"><path d="M8 1.5v13M1.5 8h13M3.4 3.4l9.2 9.2M12.6 3.4l-9.2 9.2"/></svg><b id="byname"></b></span></div>
  <div class="theme"><button type="button" id="btn-light" title="Light mode" aria-label="Light mode" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button type="button" id="btn-dark" title="Dark mode" aria-label="Dark mode" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button></div>
</header>
<main>
  <section id="intro">
    <div class="intro-inner">
      <p class="intro-kicker" id="intro-kicker"></p>
      <h2 id="intro-h"></h2>
      <p class="intro-lead" id="intro-lead"></p>
      <dl class="intro-facts" id="intro-facts"></dl>
      <button type="button" id="intro-start"><span id="intro-start-label">Start the lessons</span> <span aria-hidden="true">→</span></button>
      <p class="intro-jump" id="intro-jump"></p>
    </div>
  </section>
  <section id="left" class="panel" aria-label="Lessons">
    <div class="ph"><h2 id="subject"></h2><div class="mpick"><button type="button" id="btn-lessons" aria-expanded="false" aria-controls="list"><span id="bl-name"></span></button><button type="button" id="btn-ver" aria-expanded="false" aria-controls="tm-line" hidden><span id="bv-name"></span></button></div></div>
    <div class="tm" role="group" id="tm" hidden><div class="tmh"><span id="tm-label"></span><b id="tm-cur"></b></div><div class="tml" id="tm-line"></div></div>
    <div id="list"></div>
  </section>
  <section id="center">
    <div class="stage">
      <div class="stagebar"><div id="caption" aria-live="polite"></div><div class="sbr"><div class="views" id="variants" role="group" aria-label="Who does it" hidden></div><div class="views"><button type="button" data-view="network" aria-pressed="true">Network</button><button type="button" data-view="sequence" aria-pressed="false">Sequence</button></div></div></div>
      <div class="stagebody"><div id="viewnet"><svg id="net" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" aria-label="Message diagram"></svg></div>
      <div id="seqwrap" hidden><svg id="seq" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMin meet" aria-label="Sequence diagram"></svg></div></div>
    </div>
    <div class="flow">
      <div class="fh">
        <h2><span id="lbl-flow">Message flow</span> <span id="flowcount"></span></h2>
        <div class="ctrl">
          <button type="button" id="btn-play" title="Play / pause (space)"></button>
          <button type="button" id="btn-step" title="Next message (→)">Step<svg viewBox="0 0 24 24"><path d="M9 5l8 7-8 7z"/></svg></button>
          <button type="button" id="btn-reset" title="Back to the start">Reset</button>
        </div>
      </div>
      <div id="tablewrap"><table id="flowt"><colgroup><col style="width:52px"><col style="width:15%"><col style="width:15%"><col style="width:28%"><col></colgroup><thead><tr><th>#</th><th>From</th><th>To</th><th id="lbl-method">Method</th><th id="lbl-info">Info</th></tr></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </section>
  <aside id="right" class="panel" aria-label="Overview">
    <details class="ovw" id="ovw">
      <summary><span id="lbl-about">About this lesson</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="ovb">
        <div class="ovh"><h3 id="ov-title"></h3></div>
        <div id="ov-name"></div>
        <div id="ov-ns" class="nsbox" hidden><span class="nstag" id="ov-ns-tag"></span><p id="ov-ns-text"></p></div>
        <div id="ov-sum"></div>
        <table id="ov-facts"><tbody></tbody></table>
        <div id="ov-more"></div>
      </div>
    </details>
    <div class="insp-h"><h2 id="lbl-message">Message</h2><span id="insp-n"></span></div>
    <div id="insp"></div>
    <div class="foot" id="foot"></div>
  </aside>
</main>
<div id="riskpop" role="dialog" aria-live="polite" hidden></div>
<nav id="mbar" aria-label="Playback">
  <button type="button" id="mb-prev" aria-label="Previous message"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button type="button" id="mb-play" aria-label="Play"></button>
  <button type="button" id="mb-next" aria-label="Next message"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <button type="button" id="mb-log" aria-expanded="false" aria-controls="tablewrap"><span>Log</span><span id="mb-count"></span></button>
  <button type="button" id="mb-lesson"><span id="mb-lname"></span><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
</nav>
</div>
<script id="topic" type="application/json">{{TOPIC_JSON}}</script>
<script>{{JS}}</script>
</body>
</html>
